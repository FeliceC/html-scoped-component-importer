name: CI
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: yarn build
