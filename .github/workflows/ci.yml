name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: yarn build:lib
      - run: yarn build
